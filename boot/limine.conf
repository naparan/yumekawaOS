# yumekawaOS — Limine 設定 (Limine 11.x 形式)
# 詳細: https://github.com/limine-bootloader/limine/blob/v11.4.1/CONFIG.md

# メニューを出さず即座に既定エントリを起動する
timeout: 0

/yumekawaOS
    protocol: limine
    path: boot():/boot/kernel
    # カーネルコマンドライン。例: loglevel=trace / debug / info / warn / error / fatal
    cmdline:
