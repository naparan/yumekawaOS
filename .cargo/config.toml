# yumekawaOS はカーネル専用ワークスペースなので既定ターゲットを x86_64-unknown-none にする。
# (scripts/build.sh は明示的に --target を渡すので、この既定値に依存しない)
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # カーネルは linker.ld で 0xffffffff80000000 に固定配置する(非PIE)。
    # x86_64-unknown-none の既定 code-model=kernel と組み合わせて higher-half に置く。
    "-C", "relocation-model=static",
    # GDB でのスタック追跡と、将来のパニック時バックトレースのため。
    "-C", "force-frame-pointers=yes",
]
